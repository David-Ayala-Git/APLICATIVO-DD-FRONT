# Sirve la consola compilada y reenvia /api al gateway. Al quedar todo bajo el
# mismo origen, el navegador no hace peticiones cruzadas y CORS deja de ser un
# problema en produccion.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El gateway es el unico punto de entrada a los microservicios.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # el corte en MikroTik y la corrida de facturacion pueden tardar
        proxy_read_timeout 120s;
    }

    # Los archivos con hash en el nombre no cambian nunca: cachearlos agresivo.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El index no se cachea, para que un despliegue nuevo se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Rutas del enrutador de Angular: todo lo demas cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
